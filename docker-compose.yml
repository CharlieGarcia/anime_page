# Local development database. Start with `bun run db:up`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: anime_page
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anime -d anime_page']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
